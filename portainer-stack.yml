services:
  papra:
    image: ghcr.io/papra-hq/papra:latest-root
    container_name: papra
    restart: unless-stopped
    ports:
      - "${PAPRA_PORT:-1221}:1221"
    environment:
      AUTH_SECRET: "${PAPRA_AUTH_SECRET}"
      APP_BASE_URL: "${PAPRA_PUBLIC_URL}"
    volumes:
      - papra_app_data:/app/app-data

  receipt-assistant:
    build:
      context: ./receipt-assistant
      dockerfile: Dockerfile
    container_name: papra-receipt-assistant
    restart: unless-stopped
    depends_on:
      - papra
    ports:
      - "${RECEIPT_ASSISTANT_PORT:-8787}:8787"
    environment:
      PORT: "8787"
      PAPRA_URL: "http://papra:1221"
      PAPRA_API_TOKEN: "${PAPRA_API_TOKEN:-}"
      PAPRA_ORGANIZATION_ID: "${PAPRA_ORGANIZATION_ID:-}"
      PAPRA_PAGE_SIZE: "${PAPRA_PAGE_SIZE:-20}"
      PAPRA_DEMO: "${PAPRA_DEMO:-true}"

volumes:
  papra_app_data:
    name: papra_app_data
